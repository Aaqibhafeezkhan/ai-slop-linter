name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
  lint-prose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install slop-cop
        run: |
          version=0.1.73
          archive="slop-cop_${version}_linux_amd64.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/yasyf/slop-cop/releases/download/v${version}/${archive}"
          curl -fsSL -o checksums.txt "https://github.com/yasyf/slop-cop/releases/download/v${version}/checksums.txt"
          grep " ${archive}\$" checksums.txt | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$archive" -C "$HOME/.local/bin" slop-cop
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: npm run lint:prose
